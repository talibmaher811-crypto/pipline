name: DevSecOps Pipeline

on:
  push:
    branches: [main, "stage-*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write



env:
  PYTHON_VERSION: "3.12"
  REGISTRY: ghcr.io

jobs:
  gitleaks:
    name: Gitleaks (Secret Scan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  semgrep:
    name: Semgrep (SAST)
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@v4
      - run: semgrep scan --config auto --error --exclude-rule yaml.github-actions.security.github-actions-mutable-action-tag.github-actions-mutable-action-tag

  bandit:
    name: Bandit (SAST Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: |
          pip install bandit
          bandit -r . -ll --exclude ./tests,./venv

  hadolint:
    name: Hadolint (Lint Dockerfile)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
          failure-threshold: warning

  pylint:
    name: Pylint (Skor >= 9.0)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: |
          pip install pylint -r requirements.txt
          pylint --fail-under=9.0 $(git ls-files '*.py')

  pip-audit:
    name: pip-audit (CVE Dependency)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: |
          pip install pip-audit
          pip-audit -r requirements.txt

  pytest:
    name: pytest (Coverage >= 80%)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: |
          pip install pytest pytest-cov -r requirements.txt
          pytest --cov=app --cov-fail-under=80

  security-gate:
    name: Security Score Gate
    runs-on: ubuntu-latest
    needs: [gitleaks, semgrep, bandit, hadolint, pylint, pip-audit, pytest]
    steps:
      - name: Pastikan semua job stage 1 sukses
        run: |
          if [ "${{ contains(needs.*.result, 'failure') }}" = "true" ] || \
             [ "${{ contains(needs.*.result, 'cancelled') }}" = "true" ]; then
            echo "Security gate GAGAL"; exit 1
          fi
          echo "Security gate LOLOS"


  docker-build:
      name: Docker Build
      runs-on: ubuntu-latest
      needs: security-gate
      permissions:
        contents: read
        packages: write
      outputs:
        image: ${{ steps.meta.outputs.image }}
        digest: ${{ steps.build.outputs.digest }}
      steps:
        - uses: actions/checkout@v4

        - name: Nama image (harus lowercase)
          id: meta
          run: echo "image=${REGISTRY}/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

        - uses: docker/setup-buildx-action@v3

        - uses: docker/login-action@v3
          with:
            registry: ${{ env.REGISTRY }}
            username: ${{ github.actor }}
            password: ${{ secrets.GITHUB_TOKEN }}

        - name: Build dan push image
          id: build
          uses: docker/build-push-action@v6
          with:
            context: .
            push: true
            provenance: false
            tags: |
              ${{ steps.meta.outputs.image }}:${{ github.sha }}
              ${{ steps.meta.outputs.image }}:latest
            labels: |
              org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            cache-from: type=gha
            cache-to: type=gha,mode=max

        - name: Tampilkan hasil
          run: |
            echo "Image : ${{ steps.meta.outputs.image }}"
            echo "Digest: ${{ steps.build.outputs.digest }}"

