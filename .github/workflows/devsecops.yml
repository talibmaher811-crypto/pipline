name: DevSecOps Pipeline

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"

jobs:
  # ===================== STAGE 1: SHIFT-LEFT (paralel) =====================
  gitleaks:
    name: Gitleaks (Secret Scan)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  semgrep:
    name: Semgrep (SAST)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install semgrep
      - run: semgrep scan --config p/python --config p/owasp-top-ten --error app.py

  bandit:
    name: Bandit (SAST Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install bandit
      - run: bandit -r app.py -ll

  hadolint:
    name: Hadolint (Lint Dockerfile)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile

  pylint:
    name: Pylint (Skor >= 9.0)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: pylint app.py test_app.py --fail-under=9.0

  pip-audit:
    name: pip-audit (CVE Dependency)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install pip-audit
      - run: pip-audit -r requirements.txt

  pytest:
    name: pytest (Coverage >= 80%)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: pytest --cov=app --cov-report=term-missing --cov-report=xml --cov-fail-under=80
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage.xml

  # ===================== STAGE 2: SECURITY GATE =====================
  security-gate:
    name: Security Score Gate
    runs-on: ubuntu-latest
    needs: [gitleaks, semgrep, bandit, hadolint, pylint, pip-audit, pytest]
    if: always()
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Hitung skor, komentari PR, putuskan lolos atau gagal
        uses: actions/github-script@v7
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        with:
          script: |
            const needs = JSON.parse(process.env.NEEDS_JSON);
            const THRESHOLD = 80;
            // [id job, nama, bobot, kritis (gagal = langsung blokir)]
            const checks = [
              ['gitleaks',  'Gitleaks (Secret Scan)',     20, true],
              ['semgrep',   'Semgrep (SAST)',             15, false],
              ['bandit',    'Bandit (SAST Python)',       15, false],
              ['pip-audit', 'pip-audit (CVE Dependency)', 15, false],
              ['pytest',    'pytest (Coverage >= 80%)',   15, false],
              ['pylint',    'Pylint (Skor >= 9.0)',       10, false],
              ['hadolint',  'Hadolint (Dockerfile)',      10, false],
            ];
            let score = 0;
            let criticalFail = false;
            const rows = checks.map(([id, name, weight, critical]) => {
              const ok = needs[id].result === 'success';
              if (ok) score += weight;
              if (!ok && critical) criticalFail = true;
              const note = critical ? ' (kritis)' : '';
              return `| ${name}${note} | ${weight} | ${ok ? 'LOLOS' : 'GAGAL'} | ${ok ? weight : 0} |`;
            });
            const pass = score >= THRESHOLD && !criticalFail;
            const verdict = pass
              ? `LOLOS: skor ${score}/100 (minimal ${THRESHOLD})`
              : `DIBLOKIR: skor ${score}/100` + (criticalFail ? ' dan secret bocor terdeteksi' : ` (minimal ${THRESHOLD})`);
            const body = [
              '<!-- security-score-bot -->',
              '## Security Score Bot',
              '',
              `**${verdict}**`,
              '',
              '| Pemeriksaan | Bobot | Hasil | Poin |',
              '|---|---|---|---|',
              ...rows,
              '',
              `Commit: \`${context.sha.slice(0, 7)}\``,
            ].join('\n');

            await core.summary.addRaw(body, true).write();

            if (context.eventName === 'pull_request') {
              try {
                const { owner, repo } = context.repo;
                const issue_number = context.payload.pull_request.number;
                const { data: comments } = await github.rest.issues.listComments({ owner, repo, issue_number });
                const old = comments.find(c => c.body && c.body.includes('<!-- security-score-bot -->'));
                if (old) {
                  await github.rest.issues.updateComment({ owner, repo, comment_id: old.id, body });
                } else {
                  await github.rest.issues.createComment({ owner, repo, issue_number, body });
                }
              } catch (err) {
                core.warning(`Tidak bisa mengomentari PR: ${err.message}`);
              }
            }

            if (!pass) {
              core.setFailed(verdict);
            }

   # ===================== STAGE 3: BUILD & SUPPLY CHAIN =====================
  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [security-gate]
    if: needs.security-gate.result == 'success'
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          tags: todo-app:${{ github.sha }}
          outputs: type=docker,dest=/tmp/image.tar
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: /tmp/image.tar
          retention-days: 1

  trivy:
    name: Trivy (Scan Image)
    runs-on: ubuntu-latest
    needs: [docker-build]
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: docker-image
          path: /tmp
      - run: docker load -i /tmp/image.tar
      - name: Scan image (gagal jika ada CRITICAL)
        uses: aquasecurity/trivy-action@0.35.0
        with:
          version: v0.69.3
          image-ref: todo-app:${{ github.sha }}
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table

  syft-sbom:
    name: Syft (SBOM)
    runs-on: ubuntu-latest
    needs: [docker-build]
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: docker-image
          path: /tmp
      - run: docker load -i /tmp/image.tar
      - name: Buat SBOM
        uses: anchore/sbom-action@v0
        with:
          image: todo-app:${{ github.sha }}
          format: spdx-json
          artifact-name: sbom.spdx.json

  cosign-sign:
    name: Cosign (Tanda Tangan Image)
    runs-on: ubuntu-latest
    needs: [trivy, syft-sbom]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: docker-image
          path: /tmp
      - run: docker load -i /tmp/image.tar
      - uses: sigstore/cosign-installer@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push image dan tanda tangani
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          docker tag "todo-app:${GITHUB_SHA}" "${IMAGE}:${GITHUB_SHA}"
          docker push "${IMAGE}:${GITHUB_SHA}" | tee push.log
          HASH=$(grep -oE 'digest: sha256:[a-f0-9]{64}' push.log | awk '{print $2}')
          test -n "${HASH}"
          DIGEST="${IMAGE}@${HASH}"
          cosign sign --yes "${DIGEST}"
          echo "Image bertanda tangan: ${DIGEST}" >> "$GITHUB_STEP_SUMMARY"


     # ===================== STAGE 4: DEPLOY AMAN (self-hosted runner) =====================
  stage4-precheck:
    name: Cek Kesiapan VM
    runs-on: ubuntu-latest
    needs: [cosign-sign]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - id: check
        env:
          ENABLED: ${{ vars.STAGE4_ENABLED }}
        run: |
          if [ "$ENABLED" = "true" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "Stage 4 aktif, deploy dijalankan lewat self-hosted runner." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "STAGE4_ENABLED belum true, Stage 4 dilewati." >> "$GITHUB_STEP_SUMMARY"
          fi

  deploy-staging:
    name: Deploy Staging
    runs-on: [self-hosted, linux, deploy]
    needs: [stage4-precheck]
    if: needs.stage4-precheck.outputs.ready == 'true'
    environment: staging
    permissions:
      contents: read
      packages: read
    steps:
      - uses: sigstore/cosign-installer@v3
      - name: Login registry
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Verifikasi tanda tangan image (Cosign)
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_SHA}"
          cosign verify "${IMAGE}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-identity-regexp "^https://github.com/${GITHUB_REPOSITORY}/.github/workflows/devsecops.yml@refs/heads/main$" \
            > /dev/null
          echo "Tanda tangan image terverifikasi." >> "$GITHUB_STEP_SUMMARY"
      - name: Deploy container staging (port 8081)
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_SHA}"
          docker pull "${IMAGE}"
          docker rm -f pipline-staging >/dev/null 2>&1 || true
          docker run -d --name pipline-staging --restart unless-stopped -p 8081:8000 "${IMAGE}"
      - name: Health check staging
        run: |
          for i in $(seq 1 10); do
            if curl -fsS "http://localhost:8081/health"; then
              echo "Staging sehat." >> "$GITHUB_STEP_SUMMARY"; exit 0
            fi
            sleep 3
          done
          echo "Staging tidak sehat." >> "$GITHUB_STEP_SUMMARY"; exit 1

  zap-dast:
    name: OWASP ZAP (DAST Staging)
    runs-on: [self-hosted, linux, deploy]
    needs: [deploy-staging]
    steps:
      - name: Scan baseline ke staging
        run: |
          mkdir -p zap-out && chmod 777 zap-out
          docker run --rm --network host -v "$(pwd)/zap-out:/zap/wrk/:rw" -t ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py -t "http://localhost:8081" -r zap-report.html -I
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zap-report
          path: zap-out/zap-report.html

  deploy-production:
    name: Deploy Production
    runs-on: [self-hosted, linux, deploy]
    needs: [zap-dast]
    environment: production
    permissions:
      contents: read
      packages: read
    steps:
      - name: Login registry
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Catat image production saat ini (untuk rollback)
        id: prev
        run: |
          PREV=$(docker inspect --format='{{.Config.Image}}' pipline-prod 2>/dev/null || true)
          echo "image=${PREV}" >> "$GITHUB_OUTPUT"
          echo "Image sebelumnya: ${PREV:-tidak ada}" >> "$GITHUB_STEP_SUMMARY"
      - name: Deploy container production (port 8080)
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_SHA}"
          docker pull "${IMAGE}"
          docker rm -f pipline-prod >/dev/null 2>&1 || true
          docker run -d --name pipline-prod --restart unless-stopped -p 8080:8000 "${IMAGE}"
      - name: Health check production
        id: health
        run: |
          for i in $(seq 1 10); do
            if curl -fsS "http://localhost:8080/health"; then
              echo "Production sehat." >> "$GITHUB_STEP_SUMMARY"; exit 0
            fi
            sleep 3
          done
          exit 1
      - name: Auto-rollback ke image sebelumnya
        if: failure() && steps.health.outcome == 'failure'
        env:
          PREV_IMAGE: ${{ steps.prev.outputs.image }}
        run: |
          docker rm -f pipline-prod >/dev/null 2>&1 || true
          if [ -n "$PREV_IMAGE" ]; then
            docker run -d --name pipline-prod --restart unless-stopped -p 8080:8000 "${PREV_IMAGE}"
            echo "ROLLBACK ke ${PREV_IMAGE}" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Tidak ada image sebelumnya, container production dihentikan." >> "$GITHUB_STEP_SUMMARY"
          fi

  notify-failure:
    name: Notifikasi Gagal (GitHub Issue)
    runs-on: ubuntu-latest
    needs: [cosign-sign, deploy-staging, zap-dast, deploy-production]
    if: failure() && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Pipeline gagal di main (${context.sha.slice(0, 7)})`,
              body: `Stage Build atau Deploy gagal.\n\nRun: ${run}\nCommit: ${context.sha}\n\nPeriksa log, lalu perbaiki lewat Pull Request.`,
              labels: [],
            });
